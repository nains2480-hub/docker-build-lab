name: Banking CD

on:
  workflow_run:
    workflows: ["Banking CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t banking-app:cd ./banking-app

      - name: Deploy banking application
        run: |
          docker run -d -p 5000:5000 --name banking-app banking-app:cd
          sleep 3
          curl http://localhost:5000

      - name: Stop container
        if: always()
        run: docker stop banking-app || true