name: Banking CI

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r banking-app/requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        run: |
          cd banking-app
          pytest

      - name: Build Docker image
        run: |
          docker build -t banking-app:${{ github.sha }} ./banking-app